services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collection_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  anomaly_detection:
    build:
      context: ./services/anomaly_detection
      dockerfile: Dockerfile
    env_file: ./services/anomaly_detection/.env
    ports:
      - "50051:50051"
    restart: unless-stopped

  anomaly_classification:
    build:
      context: ./services/classification
      dockerfile: Dockerfile
    env_file: ./services/classification/.env
    ports:
      - "50052:50052"
    restart: unless-stopped

  orchestration:
    build:
      context: ./services/orchestration
      dockerfile: Dockerfile
    env_file: ./services/orchestration/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      anomaly_detection:
        condition: service_started
      anomaly_classification:
        condition: service_started
    restart: unless-stopped

  collection:
    build:
      context: ./services/collection
      dockerfile: Dockerfile
    env_file: ./services/collection/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
