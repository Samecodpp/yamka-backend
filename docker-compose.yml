version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build: .
    env_file: .env
    command: celery -A application.celery_worker.celery worker --loglevel=info --concurrency=1
    depends_on:
      - redis
      - rabbitmq
    restart: on-failure

  web:
    build: .
    env_file: .env
    command: gunicorn app:app -b 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - rabbitmq
      - worker
    restart: always

volumes:
  rabbitmq_data:
  redis_data: